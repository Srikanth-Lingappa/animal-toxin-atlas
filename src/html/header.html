<!-- html/header.html: Top bar: wordmark, tabs, theme and palette toggles. -->
<header class="top">
  <div class="shell top-inner">
    <div class="wordmark">
      <h1>Animal Toxin Atlas</h1>
      <span class="tag">UniProt/Swiss-Prot venom &amp; toxin compendium</span>
    </div>
    <div class="top-actions">
      <span class="count-pill" id="headCount">— records</span>
      <button class="theme-btn" id="cvdBtn" aria-pressed="false" title="Switch to a categorical palette that stays distinguishable for red-green and blue-yellow colour blindness">◑ color-blind safe</button>
      <button class="theme-btn" id="themeBtn" title="Toggle light / dark">◐ theme</button>
    </div>
  </div>
  <div class="shell">
    <div class="viewtabs">
      <button class="active" data-tab="browse">Browse</button>
      <button data-tab="organism">Organism</button>
      <button data-tab="taxon">Taxonomy</button>
      <button data-tab="disulfides">Disulfides</button>
      <button data-tab="who">Clinical Importance</button>
      <button data-tab="convergence">Toxin Relationships</button>
      <button data-tab="search">Similarity Search</button>
      <button data-tab="insights">Insights</button>
      <button data-tab="stats">Statistics</button>
      <button data-tab="about">About</button>
    </div>
  </div>
</header>
